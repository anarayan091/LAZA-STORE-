<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laza Store - طلب شحن</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#f4f6f9;padding:20px;}
.container{max-width:500px;margin:auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 5px 20px rgba(0,0,0,.15);}
h2{text-align:center;margin-bottom:20px;}
input,textarea,select,button{width:100%;padding:12px;margin-top:10px;border:1px solid #ccc;border-radius:8px;font-size:15px;}
textarea{resize:vertical;}
button{background:#2563eb;color:#fff;border:none;cursor:pointer;}
button:disabled{background:#9ca3af;cursor:not-allowed;}
#status{margin-top:15px;text-align:center;font-weight:bold;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>
<div class="container">
<h2>طلب شحن</h2>
<form id="orderForm">
<input name="username" placeholder="اسم المستخدم" required>
<input type="email" name="email" placeholder="البريد الإلكتروني" required>
<input name="game" placeholder="اسم اللعبة" required>
<input name="uid" placeholder="UID / Username" required>
<input name="product_id" placeholder="معرف المنتج" required>
<input name="product" placeholder="اسم المنتج" required>
<select name="recharge_type" required>
<option value="">اختر نوع التعبئة</option>
<option value="Maroc Telecom">Maroc Telecom</option>
<option value="Orange">Orange</option>
</select>
<textarea name="code" rows="5" required placeholder="مثال:
5DH=12345678901234
10DH=98765432109876"></textarea>
<input name="voucher" placeholder="رمز القسيمة (اختياري)">
<textarea name="notes" placeholder="ملاحظات">لا يوجد</textarea>
<button type="submit">إرسال الطلب</button>
</form><div id="status"></div></div>
<script>
emailjs.init({publicKey:"lIJCM6PpQ7iUHlJI8"});
let sending=false; const COOLDOWN=60;
document.getElementById("orderForm").addEventListener("submit",function(e){
e.preventDefault();
const status=document.getElementById("status"); const btn=this.querySelector("button");
if(sending)return;
const lastSend=localStorage.getItem("lastSend");
if(lastSend){const diff=Math.floor((Date.now()-parseInt(lastSend))/1000); if(diff<COOLDOWN){status.innerHTML="⏳ يرجى الانتظار "+(COOLDOWN-diff)+" ثانية قبل إرسال طلب جديد."; return;}}
sending=true; btn.disabled=true; btn.innerHTML="⏳ جاري إرسال الطلب...";
const orderId="ORD-"+Date.now()+"-"+Math.floor(Math.random()*10000);
const data={order_id:orderId,username:this.username.value,email:this.email.value,game:this.game.value,uid:this.uid.value,product_id:this.product_id.value,product:this.product.value,recharge_type:this.recharge_type.value,code:this.code.value,voucher:this.voucher.value,notes:this.notes.value};
emailjs.send("service_rhsuhtu","template_rxblebt",data)
.then(()=>emailjs.send("service_rhsuhtu","template_yo8ql8r",data))
.then(()=>{
localStorage.setItem("lastSend",Date.now());
status.innerHTML="✅ تم إرسال الطلب بنجاح.<br><br>رقم الطلب:<br><b>"+orderId+"</b>";
this.reset();
let seconds=60; btn.innerHTML="⏳ انتظر 60 ثانية";
const timer=setInterval(()=>{seconds--; btn.innerHTML="⏳ انتظر "+seconds+" ثانية"; if(seconds<=0){clearInterval(timer); btn.disabled=false; btn.innerHTML="إرسال الطلب"; sending=false;}},1000);
})
.catch(function(error){console.log(error); status.innerHTML="❌ فشل إرسال الطلب، حاول مرة أخرى."; btn.disabled=false; btn.innerHTML="إرسال الطلب"; sending=false;});
});
</script></body></html>
